[project]
name = "tscm"
version = "0.1.0"
description = "Tiered structural causal model for joint runtime and resource prediction of Spark and distributed GPU jobs."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Charles Dietzel" }]
dependencies = [
    "causal-learn>=0.1.3.8",
    "jax>=0.4.30",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "numpyro>=0.15",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scipy>=1.12",
]

[project.optional-dependencies]
chameleon = ["python-chi>=1.2", "python-blazarclient>=4"]
gpu = ["torch>=2.2"]
spark = ["pyspark>=3.5,<3.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tscm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs NUTS or other long fits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "N"]
